<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-user-select: none; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent;
    font-family: 'Segoe UI', system-ui, sans-serif; }
  .pill { width: 100%; height: 100%; border-radius: 12px; position: relative;
    background: rgba(12,12,14,.62); border: 1px solid rgba(255,255,255,.08);
    display: flex; flex-direction: column; justify-content: center; padding: 10px 36px 10px 16px;
    cursor: grab; }
  .cur { font-size: 16px; font-weight: 600; color: #fff; line-height: 1.25;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-shadow: 0 1px 2px rgba(0,0,0,.8); }
  .next { margin-top: 3px; font-size: 12px; color: rgba(255,255,255,.55); line-height: 1.2;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 14px; }
  .x { position: absolute; top: 6px; right: 8px; width: 22px; height: 22px; border: none;
    background: transparent; color: rgba(255,255,255,.55); cursor: pointer; border-radius: 4px; font-size: 13px; }
  .x:hover { color: #fff; background: rgba(255,255,255,.08); }
</style>
</head>
<body>
  <div class="pill" id="pill">
    <div class="cur" id="cur">Lyrics</div>
    <div class="next" id="next"></div>
    <button class="x" id="close" title="Close">✕</button>
  </div>
  <script>
    const { ipcRenderer } = require('electron');
    const cur = document.getElementById('cur');
    const next = document.getElementById('next');
    const pill = document.getElementById('pill');
    let dragging = false;
    document.getElementById('close').onclick = (e) => {
      e.stopPropagation();
      ipcRenderer.send('lyric-close');
    };
    pill.addEventListener('mousedown', (e) => {
      if (e.button !== 0 || e.target.id === 'close') return;
      dragging = true;
      ipcRenderer.send('lyric-drag-start');
      e.preventDefault();
    });
    function endDrag() {
      if (!dragging) return;
      dragging = false;
      ipcRenderer.send('lyric-drag-end');
    }
    window.addEventListener('mouseup', endDrag);
    window.addEventListener('blur', endDrag);
    ipcRenderer.on('lyric-line', (e, d) => {
      const text = (d && d.text) || '';
      cur.textContent = text || '…';
      next.textContent = (d && d.next) || '';
    });
  </script>
</body>
</html>
